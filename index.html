<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christine Z — About Me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;1,400&family=Archivo+Black&family=EB+Garamond:ital,wght@0,400;1,400&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --cream:      #F5EFC7;
            --white:      #FAFAF8;
            --navy:       #1E2840;
            --black:      #1A1A1A;
            --gray:       #666;
            --sans:       'Nanum Myeongjo', Georgia, serif;
            --black-font: 'Archivo Black', system-ui, sans-serif;
            --serif:      'EB Garamond', Georgia, serif;
        }

        body {
            background: var(--white);
            color: var(--black);
            font-family: var(--sans);
            text-transform: lowercase;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main.content { flex: 1; }

        /* ── HEADER ── */
        .site-header {
            position: fixed;
            top: 0;
            right: 0;
            padding: 20px 32px;
            z-index: 100;
        }

        .site-header h1 {
            font-family: var(--black-font);
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1;
        }

        /* ── HAMBURGER ── */
        .nav-toggle {
            position: fixed;
            top: 20px;
            left: 28px;
            z-index: 200;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 4px;
        }

        .nav-toggle span {
            display: block;
            width: 24px;
            height: 1.5px;
            background: var(--black);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .nav-toggle.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
        .nav-toggle.open span:nth-child(2) { opacity: 0; }
        .nav-toggle.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

        /* ── NAV MENU ── */
        .nav-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background: var(--white);
            border-right: 1px solid rgba(0,0,0,0.1);
            z-index: 150;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 40px;
            transform: translateX(-100%);
            transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-menu.open { transform: translateX(0); }

        .nav-menu a {
            font-family: var(--black-font);
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-transform: lowercase;
            color: var(--black);
            text-decoration: none;
            margin-bottom: 28px;
            opacity: 0.4;
            transition: opacity 0.2s ease;
        }

        .nav-menu a:hover { opacity: 1; }
        .nav-menu a:last-child { position: absolute; bottom: 60px; }
        .nav-menu a.active { opacity: 1; }

        .nav-overlay {
            position: fixed;
            inset: 0;
            z-index: 140;
            display: none;
        }
        .nav-overlay.visible { display: block; }

        /* ── MAIN CONTENT ── */
        .content {
            max-width: 860px;
            margin: 0 auto;
            padding: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .content-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        /* ── PHOTO STACK ── */
        .photo-stack-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .binder-clip {
            width: 90px;
            position: relative;
            z-index: 10;
            margin-bottom: -24px;
        }

        .photo-stack {
            position: relative;
            width: 230px;
            height: 300px;
        }

        .photo-stack img {
            position: absolute;
            width: 210px;
            height: 270px;
            object-fit: cover;
            left: 50%;
            top: 0;
            transform-origin: top center;
            box-shadow: 2px 6px 20px rgba(0,0,0,0.18);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        /* back — baby */
        .photo-stack img:nth-child(1) {
            transform: translateX(-50%) rotate(-11deg);
            opacity: 0.45;
            z-index: 1;
        }

        /* front — photobooth */
        .photo-stack img:nth-child(2) {
            transform: translateX(-50%) rotate(6deg);
            opacity: 1;
            z-index: 2;
        }

        /* hover: baby comes forward fully opaque, photobooth recedes behind */
        .photo-stack:hover img:nth-child(1) {
            transform: translateX(-50%) rotate(-11deg);
            opacity: 1;
            z-index: 3;
        }

        .photo-stack:hover img:nth-child(2) {
            opacity: 0.35;
            z-index: 2;
        }

        .stack-tagline {
            margin-top: 28px;
            font-family: var(--serif);
            font-size: 13px;
            color: var(--gray);
            letter-spacing: 0.01em;
            text-align: center;
        }

        /* ── BODY SECTIONS ── */
        .section {
            margin-bottom: 48px;
        }

        .section p {
            font-size: 14.5px;
            line-height: 1.85;
            color: var(--black);
            margin-bottom: 16px;
        }

        .about-link {
            display: inline-block;
            margin-top: 28px;
            font-family: var(--serif);
            font-size: 13px;
            color: var(--gray);
            text-decoration: none;
            letter-spacing: 0.01em;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.2);
            transition: color 0.2s ease, border-color 0.2s ease;
        }
        .about-link:hover { color: var(--black); border-color: var(--black); }

        strong {
            font-family: var(--black-font);
            font-weight: 400;
        }

        /* ── RESUME SUMMARY ── */
        .resume-summary {
            text-align: left;
            width: 100%;
            max-width: 400px;
        }
        .resume-tagline {
            font-size: 15.5px;
            line-height: 1.75;
            color: var(--black);
            opacity: 0.85;
            margin-bottom: 28px;
        }
        .resume-rows {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .resume-row {
            display: grid;
            grid-template-columns: 48px 140px 1fr;
            align-items: baseline;
            gap: 0 16px;
            text-align: left;
        }
        .resume-year {
            font-size: 13px;
            color: var(--black);
            opacity: 0.35;
            letter-spacing: 0.04em;
        }
        .resume-org {
            font-family: var(--black-font);
            font-size: 15px;
            font-weight: 400;
        }
        .resume-role {
            font-size: 14.5px;
            color: var(--black);
            opacity: 0.45;
        }

        .resume-org a {
            color: inherit;
            text-decoration: none;
            position: relative;
        }
        .resume-org a::after {
            content: ' →';
            opacity: 0;
            font-family: var(--sans);
            font-size: 12px;
            transition: opacity 0.2s ease;
        }
        .resume-org a:hover::after { opacity: 0.5; }
        .resume-org a:hover { opacity: 0.65; }

        /* ── FOOTER ── */
        .site-footer {
            background: var(--navy);
            color: rgba(255,255,255,0.55);
            font-size: 12px;
            font-family: var(--sans);
            letter-spacing: 0.08em;
            text-transform: lowercase;
            padding: 20px 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    
        .footer-icons { display: flex; gap: 16px; align-items: center; }
        .footer-icons a { color: rgba(255,255,255,0.55); transition: color 0.2s ease; display: flex; }
        @view-transition { navigation: auto; }
        .footer-icons a:hover { color: rgba(255,255,255,1); }
    </style>
</head>

    <script>
        function toggleNav() {
            const open = document.getElementById('navMenu').classList.toggle('open');
            document.getElementById('navToggle').classList.toggle('open', open);
            document.getElementById('navOverlay').classList.toggle('visible', open);
        }
        function closeNav() {
            document.getElementById('navMenu').classList.remove('open');
            document.getElementById('navToggle').classList.remove('open');
            document.getElementById('navOverlay').classList.remove('visible');
        }
    </script>
